<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Guru - SIGMA EDU PRO</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Lokal -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            padding-top: 35px;
            padding-bottom: 110px;
            margin: 0;
        }

        /* BINGKAI MOTIF TANIMBAR */
        .frame-tanimbar-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background-image: url('../assets/motif-tanimbar.jpg');
            background-position: top center;
            background-size: 100% auto;
            background-repeat: no-repeat;
            z-index: 9999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .frame-tanimbar-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 95px;
            background-image: url('../assets/motif-tanimbar.jpg');
            background-position: bottom center;
            background-size: 100% auto;
            background-repeat: no-repeat;
            z-index: 9999;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.15);
        }

        /* SIDEBAR TANIMBAR */
        .sidebar-tanimbar {
            background: linear-gradient(180deg, #1a1a1a 0%, #800020 100%);
            border-radius: 16px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .card-header-tanimbar {
            border-left: 5px solid #800020;
        }
    </style>
</head>
<body>

<!-- Bingkai Motif Top & Bottom -->
<div class="frame-tanimbar-top"></div>
<div class="frame-tanimbar-bottom"></div>

<div class="container-fluid px-4">
    <div class="row g-3">

        <!-- KIRI: SIDEBAR -->
        <div class="col-lg-2 col-md-3">
            <div class="sidebar-tanimbar text-white text-center">
                <div class="mb-3">
                    <img src="../assets/logoSMPK4.png" alt="Logo SMP Kristen 4 Tanut" class="img-fluid mb-2" style="max-width: 80px;" onerror="this.style.display='none'">
                    <h5 class="fw-bold mb-0">SIGMA EDU</h5>
                    <span class="badge bg-warning text-dark fw-bold mb-1">PRO</span>
                    <p class="small text-white-50 mb-0" style="font-size: 11px;">SMP Kristen 4 Tanut</p>
                </div>

                <hr class="border-warning opacity-50 my-2">

                <div class="nav flex-column gap-1 text-start">
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="dashboard.html">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                    <a class="nav-link active bg-warning text-dark fw-bold rounded-3 py-2 px-3" href="guru.html">
                        <i class="bi bi-person-badge me-2"></i>Data Guru
                    </a>
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="siswa.html">
                        <i class="bi bi-mortarboard me-2"></i>Data Siswa
                    </a>
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="kelas.html">
                        <i class="bi bi-building me-2"></i>Data Kelas
                    </a>
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="mapel.html">
                        <i class="bi bi-book me-2"></i>Mata Pelajaran
                    </a>
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="absensi.html">
                        <i class="bi bi-calendar-check me-2"></i>Absensi
                    </a>
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="jurnal.html">
                        <i class="bi bi-journal-bookmark me-2"></i>Jurnal Mengajar
                    </a>
                    <a class="nav-link text-white opacity-75 rounded-3 py-2 px-3" href="nilai.html">
                        <i class="bi bi-award me-2"></i>Nilai Siswa
                    </a>
                    <button class="btn btn-danger w-100 fw-semibold rounded-3 mt-3 py-2 shadow-sm" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- KANAN: KONTEN UTAMA -->
        <div class="col-lg-10 col-md-9">

            <!-- Header Card -->
            <div class="card rounded-4 p-3 bg-white shadow-sm mb-3 card-header-tanimbar">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h4 class="fw-bold mb-0 text-dark"><i class="bi bi-person-badge text-danger me-2"></i>Kelola Data Guru</h4>
                        <small class="text-muted">SMP Kristen 4 Tanut</small>
                    </div>
                    <!-- Tombol Membuka Pop-up Form Input Guru -->
                    <button class="btn btn-primary fw-semibold rounded-3 px-3 py-2" onclick="bukaModalTambah()">
                        <i class="bi bi-plus-circle me-1"></i> Tambah Guru Baru
                    </button>
                </div>
            </div>

            <!-- Tabel Data Guru -->
            <div class="card rounded-4 p-4 bg-white shadow-sm">
                <div class="table-responsive" style="min-height: 250px;">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th width="60">No</th>
                                <th>NIP / NUPTK</th>
                                <th>Nama Lengkap</th>
                                <th>Jabatan</th>
                                <th>No. HP/WA</th>
                                <th width="100" class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelGuruBody">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- POP-UP / MODAL FORM TAMBAH & EDIT GURU -->
<div class="modal fade" id="modalTambahGuru" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0">
            <div class="modal-header bg-danger text-white rounded-top-4">
                <h5 class="modal-title fw-bold" id="modalJudul"><i class="bi bi-person-plus-fill me-2"></i>Tambah Data Guru</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="formGuru" onsubmit="simpanGuru(event)">
                <input type="hidden" id="editIndex" value="-1">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">NIP / NUPTK</label>
                        <input type="text" class="form-control rounded-3" id="inputNip" placeholder="Masukkan NIP atau NUPTK" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Lengkap & Gelar</label>
                        <input type="text" class="form-control rounded-3" id="inputNama" placeholder="Contoh: Ruben Ambalao, S.Pd." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Jabatan / Mapel</label>
                        <input type="text" class="form-control rounded-3" id="inputMapel" placeholder="Contoh: Kepala Sekolah" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">No. HP / WA</label>
                        <input type="tel" class="form-control rounded-3" id="inputHp" placeholder="Contoh: 082397523433" required>
                    </div>
                </div>
                <div class="modal-footer bg-light rounded-bottom-4">
                    <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-danger rounded-3 fw-semibold"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>

<!-- SCRIPT LOGIKA SIMPAN, EDIT & HAPUS GURU -->
<script>
    let modalBs;

    document.addEventListener("DOMContentLoaded", function () {
        modalBs = new bootstrap.Modal(document.getElementById('modalTambahGuru'));
        tampilDataGuru();
    });

    // 1. Tampilkan Data dari LocalStorage ke Tabel
    function tampilDataGuru() {
        let dataGuru = JSON.parse(localStorage.getItem("dataGuru"));

        // Jika localStorage masih kosong saat pertama kali aplikasi dijalankan, isi dengan data awal ini
        if (!dataGuru || dataGuru.length === 0) {
            dataGuru = [
                {
                    nip: "198203212008041002",
                    nama: "Edy Wenan S. Slarmanat, S.Pd",
                    mapel: "Kepala Sekolah",
                    hp: "082397523433"
                }
            ];
            localStorage.setItem("dataGuru", JSON.stringify(dataGuru));
        }

        let tabelBody = document.getElementById("tabelGuruBody");
        let html = "";

        dataGuru.forEach((guru, index) => {
            html += `
                <tr>
                    <td class="fw-bold">${index + 1}</td>
                    <td><span class="badge bg-secondary">${guru.nip}</span></td>
                    <td class="fw-bold text-dark">${guru.nama}</td>
                    <td><span class="badge bg-danger bg-opacity-10 text-danger border border-danger">${guru.mapel}</span></td>
                    <td><a href="https://wa.me/${guru.hp.replace(/^0/, '62')}" target="_blank" class="text-decoration-none text-success"><i class="bi bi-whatsapp me-1"></i>${guru.hp}</a></td>
                    <td class="text-center">
                        <!-- Dropdown Tombol Pensil Kuning -->
                        <div class="dropdown">
                            <button class="btn btn-sm btn-warning text-dark rounded-3 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-3">
                                <li>
                                    <button class="dropdown-item text-primary fw-medium" type="button" onclick="editGuru(${index})">
                                        <i class="bi bi-pencil-square me-2"></i>Edit
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item text-danger fw-medium" type="button" onclick="hapusGuru(${index})">
                                        <i class="bi bi-trash-fill me-2"></i>Delete
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
            `;
        });

        tabelBody.innerHTML = html;
    }

    // 2. Buka Modal Tambah Data Baru
    function bukaModalTambah() {
        document.getElementById("editIndex").value = "-1";
        document.getElementById("formGuru").reset();
        document.getElementById("modalJudul").innerHTML = `<i class="bi bi-person-plus-fill me-2"></i>Tambah Data Guru`;
        modalBs.show();
    }

    // 3. Buka Modal Edit Data Guru
    function editGuru(index) {
        let dataGuru = JSON.parse(localStorage.getItem("dataGuru")) || [];
        let guru = dataGuru[index];

        document.getElementById("editIndex").value = index;
        document.getElementById("inputNip").value = guru.nip;
        document.getElementById("inputNama").value = guru.nama;
        document.getElementById("inputMapel").value = guru.mapel;
        document.getElementById("inputHp").value = guru.hp;

        document.getElementById("modalJudul").innerHTML = `<i class="bi bi-pencil-square me-2"></i>Edit Data Guru`;
        modalBs.show();
    }

    // 4. Simpan Data Guru (Tambah atau Edit)
    function simpanGuru(event) {
        event.preventDefault();

        let index = parseInt(document.getElementById("editIndex").value);
        let nip = document.getElementById("inputNip").value;
        let nama = document.getElementById("inputNama").value;
        let mapel = document.getElementById("inputMapel").value;
        let hp = document.getElementById("inputHp").value;

        let dataGuru = JSON.parse(localStorage.getItem("dataGuru")) || [];

        if (index === -1) {
            // Tambah baru
            dataGuru.push({ nip, nama, mapel, hp });
        } else {
            // Update data yang ada
            dataGuru[index] = { nip, nama, mapel, hp };
        }

        localStorage.setItem("dataGuru", JSON.stringify(dataGuru));

        modalBs.hide();
        tampilDataGuru();
    }

    // 5. Hapus Data Guru
    function hapusGuru(index) {
        if (confirm("Apakah Anda yakin ingin menghapus data guru ini?")) {
            let dataGuru = JSON.parse(localStorage.getItem("dataGuru")) || [];
            dataGuru.splice(index, 1);
            localStorage.setItem("dataGuru", JSON.stringify(dataGuru));
            tampilDataGuru();
        }
    }
</script>

</body>
</html>
