<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SIGMA EDU PRO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-lg-2 sidebar p-3">
            <h3 class="text-white text-center mb-4">SIGMA EDU PRO</h3>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="guru.html"><i class="bi bi-person-badge me-2"></i>Guru</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="siswa.html"><i class="bi bi-mortarboard me-2"></i>Siswa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="kelas.html"><i class="bi bi-building me-2"></i>Kelas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="mapel.html"><i class="bi bi-book me-2"></i>Mapel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="absensi.html"><i class="bi bi-calendar-check me-2"></i>Absensi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="jurnal.html"><i class="bi bi-journal-bookmark me-2"></i>Jurnal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="nilai.html"><i class="bi bi-award me-2"></i>Nilai</a>
                </li>
                <li class="nav-item mt-4">
                    <button class="btn btn-danger w-100" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </li>
            </ul>
        </div>

        <!-- Content Area -->
        <div class="col-lg-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
                <div>
                    <h4 class="fw-bold text-primary mb-0">Selamat Datang di SIGMA EDU PRO</h4>
                    <small class="text-muted">SMP Kristen 4 Tanut</small>
                </div>
            </div>

            <!-- Kartu Statistik Rekapitulasi -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card bg-primary text-white p-3 shadow-sm border-0">
                        <small>Total Guru</small>
                        <h2 id="totalGuru" class="fw-bold mb-0">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white p-3 shadow-sm border-0">
                        <small>Total Siswa</small>
                        <h2 id="totalSiswa" class="fw-bold mb-0">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-dark p-3 shadow-sm border-0">
                        <small>Total Kelas</small>
                        <h2 id="totalKelas" class="fw-bold mb-0">0</h2>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-info text-white p-3 shadow-sm border-0">
                        <small>Mata Pelajaran</small>
                        <h2 id="totalMapel" class="fw-bold mb-0">0</h2>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
