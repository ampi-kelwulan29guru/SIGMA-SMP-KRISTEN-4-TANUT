<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Guru - SIGMA EDU PRO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-lg-2 sidebar p-3">
            <h3 class="text-white text-center mb-4 fw-bold">SIGMA EDU<br>PRO</h3>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="guru.html"><i class="bi bi-person-badge me-2"></i>Guru</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="siswa.html"><i class="bi bi-mortarboard me-2"></i>Siswa</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="kelas.html"><i class="bi bi-building me-2"></i>Kelas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="mapel.html"><i class="bi bi-book me-2"></i>Mapel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="absensi.html"><i class="bi bi-calendar-check me-2"></i>Absensi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="jurnal.html"><i class="bi bi-journal-bookmark me-2"></i>Jurnal</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="nilai.html"><i class="bi bi-award me-2"></i>Nilai</a>
                </li>
                <li class="nav-item mt-4">
                    <button class="btn btn-danger w-100" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </li>
            </ul>
        </div>

        <!-- Content Area -->
        <div class="col-lg-10 p-4">

            <!-- Header Panel -->
            <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
                <div>
                    <h4 class="fw-bold text-primary mb-0"><i class="bi bi-person-badge me-2"></i>Kelola Data Guru</h4>
                    <small class="text-muted">SMP Kristen 4 Tanut</small>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalGuru">
                    <i class="bi bi-plus-circle me-1"></i>Tambah Guru Baru
                </button>
            </div>

            <!-- Tabel Data Guru -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-primary">
                                <tr>
                                    <th class="ps-3">No</th>
                                    <th>NIP / NUPTK</th>
                                    <th>Nama Lengkap</th>
                                    <th>Jabatan</th>
                                    <th>No. HP/WA</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelGuru">
                                <!-- Data guru dimuat otomatis dari IndexedDB oleh js/guru.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Form Tambah Guru -->
<div class="modal fade" id="modalGuru" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-person-plus me-2"></i>Tambah Data Guru</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="formGuru">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">NIP / NUPTK</label>
                        <input type="text" id="nip" class="form-control" placeholder="Contoh: 198501..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Lengkap & Gelar</label>
                        <input type="text" id="nama" class="form-control" placeholder="Contoh: Bpk. John Doe, S.Pd." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jabatan</label>
                        <select id="jabatan" class="form-select" required>
                            <option value="" selected disabled>-- Pilih Jabatan --</option>
                            <option value="Kepala Sekolah">Kepala Sekolah</option>
                            <option value="Wakil Kepala Sekolah">Wakil Kepala Sekolah</option>
                            <option value="Wali Kelas">Wali Kelas</option>
                            <option value="Guru Mata Pelajaran">Guru Mata Pelajaran</option>
                            <option value="Guru BK">Guru BK</option>
                            <option value="Guru Piket">Guru Piket</option>
                            <option value="Staf TU">Staf TU / Administrasi</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nomor WhatsApp/HP</label>
                        <input type="tel" id="hp" class="form-control" placeholder="08xxxxxxxxxx">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/db.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/guru.js"></script>
</body>
</html>
