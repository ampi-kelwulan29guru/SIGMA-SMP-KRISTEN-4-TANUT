<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - SIGMA EDU PRO</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f4f6f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .logout-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #fee2e2;
            color: #dc3545;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 36px;
        }

        .spinner-border {
            width: 2rem;
            height: 2rem;
        }
    </style>
</head>
<body>

<div class="logout-card">
    <!-- Logo Sekolah -->
    <img src="../logo-sekolah.jpg" alt="Logo SMP Kristen 4 Tanut" class="img-fluid mb-3" style="max-height: 70px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.15));">

    <div class="icon-circle shadow-sm">
        <i class="bi bi-box-arrow-right"></i>
    </div>

    <h4 class="fw-bold text-dark mb-1">Berhasil Keluar</h4>
    <p class="text-muted small mb-4">Sesi Anda telah diakhiri secara aman. Terima kasih telah menggunakan SIGMA EDU PRO.</p>

    <!-- Indicator Loading Pengalihan -->
    <div class="d-flex align-items-center justify-content-center gap-2 mb-4 text-primary">
        <div class="spinner-border text-danger" role="status"></div>
        <span class="small fw-semibold text-secondary">Mengalihkan ke halaman Login...</span>
    </div>

    <a href="../index.html" class="btn btn-danger w-100 rounded-3 fw-bold py-2 shadow-sm">
        <i class="bi bi-arrow-left-circle me-2"></i>Login Kembali Sekarang
    </a>
</div>

<!-- SCRIPT PEMBERSIHAN SESI & REDIRECT -->
<script src="../js/db.js"></script>
<script>
    // Menghapus data sesi login pengguna saat halaman dibuka
    localStorage.removeItem("currentUser");
    sessionStorage.clear();

    // Mengalihkan secara otomatis ke halaman login (index.html) dalam 2.5 detik
    setTimeout(function() {
        window.location.href = "../index.html";
    }, 2500);
</script>

</body>
</html>
