<!-- Form Input Siswa -->
<form id="formSiswa" onsubmit="tambahSiswa(event)">
    <div class="mb-3">
        <label class="form-label">NISN</label>
        <input type="number" id="inputNisn" class="form-control" placeholder="Masukkan NISN" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" id="inputNama" class="form-control" placeholder="Masukkan Nama Siswa" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Kelas</label>
        <select id="inputKelas" class="form-select">
            <option value="Kelas 7">Kelas 7</option>
            <option value="Kelas 8">Kelas 8</option>
            <option value="Kelas 9">Kelas 9</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Jenis Kelamin</label>
        <select id="inputGender" class="form-select">
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save me-1"></i> Simpan Data Siswa</button>
</form>

<!-- Tabel Menampilkan Siswa -->
<div class="table-responsive mt-4">
    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th>No</th>
                <th>NISN</th>
                <th>Nama Siswa</th>
                <th>Kelas</th>
                <th>L/P</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelSiswa">
            <!-- Data akan otomatis dirender di sini via JS -->
        </tbody>
    </table>
</div>

<!-- Pemanggilan File JS di Bagian Bawah -->
<script src="../js/db.js"></script>
<script src="../js/siswa.js"></script>
