<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Absensi - SIGMA</title>

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .sidebar-card {
            background: linear-gradient(180deg, #800020 0%, #4a0013 100%);
            border-radius: 20px;
            color: white;
            padding: 1.5rem;
            min-height: 85vh;
        }

        .brand-logo {
            max-height: 75px;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.3));
        }

        .banner-header {
            background: linear-gradient(135deg, #e6a100 0%, #cca000 100%);
            border-radius: 15px;
            color: #1a1a1a;
            padding: 1.5rem;
        }

        .form-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 1.5rem;
            border: none;
        }
    </style>
</head>
<body class="p-3 p-md-4">

<div class="container-fluid">
    <div class="row g-4">
        
        <!-- SIDEBAR KIRI -->
        <div class="col-lg-3 col-md-4">
            <div class="sidebar-card text-center shadow-sm">
                <img src="../logo-sekolah.jpg" alt="Logo SMPK 4 Tanut" class="brand-logo mb-3">
                <h4 class="fw-bold mb-0">SIGMA</h4>
                <p class="small text-white-50 mb-4">SMP Kristen 4 Tanimbar Utara</p>

                <!-- Profile User Badge -->
                <div id="userProfileBadge" class="bg-white bg-opacity-10 p-3 rounded-3 text-start">
                    <!-- Ditampilkan via JS -->
                </div>

                <hr class="border-light opacity-25 my-4">

                <!-- Tombol Navigasi Kembali -->
                <a href="dashboard.html" class="btn btn-outline-light w-100 py-2 rounded-3 fw-bold">
                    <i class="bi bi-house-door-fill me-1"></i> Dashboard
                </a>
            </div>
        </div>

        <!-- KONTEN UTAMA -->
        <div class="col-lg-9 col-md-8">
            
            <!-- Banner Modul -->
            <div class="banner-header shadow-sm mb-4">
                <span class="badge bg-dark text-white mb-2"><i class="bi bi-calendar-check me-1"></i> MODUL ABSENSI</span>
                <h3 class="fw-bold mb-1">Input Absensi Harian 📝</h3>
                <p class="mb-0 opacity-75">Pencatatan kehadiran siswa untuk Guru Mata Pelajaran dan Wali Kelas</p>
            </div>

            <!-- Form & Tabel Absensi (TUNGGAL) -->
            <div class="form-card">
                <div class="row g-3 align-items-end mb-4">
                    <!-- Dropdown Pilih Kelas -->
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary small">Pilih Kelas</label>
                        <select id="selectKelas" class="form-select form-select-lg rounded-3 fs-6" onchange="loadSiswaByKelas()">
                            <option value="" disabled selected>-- Pilih Kelas --</option>
                            <option value="Kelas 7">Kelas 7</option>
                            <option value="Kelas 8">Kelas 8</option>
                            <option value="Kelas 9">Kelas 9</option>
                        </select>
                    </div>

                    <!-- Input Tanggal -->
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-secondary small">Tanggal Absensi</label>
                        <input type="date" id="tanggalAbsen" class="form-control form-control-lg rounded-3 fs-6">
                    </div>

                    <!-- Tombol Simpan -->
                    <div class="col-md-4">
                        <button class="btn btn-success btn-lg w-100 fw-bold rounded-3 fs-6" onclick="simpanAbsensi()">
                            <i class="bi bi-floppy-fill me-1"></i> Simpan Absensi
                        </button>
                    </div>
                </div>

                <!-- Tabel Daftar Siswa -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle border text-center">
                        <thead class="table-light">
                            <tr>
                                <th width="8%">NO</th>
                                <th width="20%">NISN</th>
                                <th width="35%" class="text-start">NAMA SISWA</th>
                                <th width="37%">STATUS KEHADIRAN</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyAbsensi">
                            <tr>
                                <td colspan="4" class="text-muted py-4">
                                    <i class="bi bi-info-circle fs-4 d-block mb-1"></i>
                                    Silakan pilih kelas terlebih dahulu untuk menampilkan daftar siswa.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>
</div>

<!-- JavaScript Modul -->
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Set default tanggal hari ini
        document.getElementById('tanggalAbsen').valueAsDate = new Date();
    });

    // Load Data Siswa Berdasarkan Kelas yang Dipilih
    async function loadSiswaByKelas() {
        const selectKelas = document.getElementById('selectKelas').value;
        const tbody = document.getElementById('tbodyAbsensi');

        if (!selectKelas) return;

        tbody.innerHTML = `
            <tr>
                <td colspan="4" class="text-muted py-4">
                    <div class="spinner-border text-warning spinner-border-sm me-2" role="status"></div>
                    Memuat data siswa kelas ${selectKelas}...
                </td>
            </tr>
        `;

        let listSiswa = [];
        
        // Ambil data siswa dari IndexedDB
        if (typeof getAllData === 'function') {
            const allSiswa = await getAllData('siswa').catch(() => []);
            // Normalisasi pencocokan format kelas ("8" atau "Kelas 8")
            listSiswa = allSiswa.filter(s => {
                const kSiswa = (s.kelas || s.kelasSiswa || '').toString().toLowerCase().trim();
                const kTarget = selectKelas.toLowerCase().trim();
                return kSiswa === kTarget || kSiswa === kTarget.replace('kelas ', '') || `kelas ${kSiswa}` === kTarget;
            });
        }

        if (listSiswa.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-muted py-4 text-center">
                        <i class="bi bi-exclamation-circle text-warning fs-3 d-block mb-2"></i>
                        Belum ada data siswa terdaftar di <strong>${selectKelas}</strong>.
                    </td>
                </tr>
            `;
            return;
        }

        // Render Baris Siswa
        let html = '';
        listSiswa.forEach((siswa, index) => {
            const nisn = siswa.nisn || '-';
            const nama = siswa.nama || siswa.namaLengkap || 'Siswa ' + (index + 1);
            const idSiswa = siswa.id || index;

            html += `
                <tr>
                    <td>${index + 1}</td>
                    <td><span class="badge bg-light text-dark border">${nisn}</span></td>
                    <td class="text-start fw-semibold">${nama}</td>
                    <td>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="status_${idSiswa}" id="h_${idSiswa}" value="H" checked>
                            <label class="btn btn-outline-success btn-sm fw-bold" for="h_${idSiswa}">H (Hadir)</label>

                            <input type="radio" class="btn-check" name="status_${idSiswa}" id="s_${idSiswa}" value="S">
                            <label class="btn btn-outline-warning btn-sm fw-bold" for="s_${idSiswa}">S (Sakit)</label>

                            <input type="radio" class="btn-check" name="status_${idSiswa}" id="i_${idSiswa}" value="I">
                            <label class="btn btn-outline-primary btn-sm fw-bold" for="i_${idSiswa}">I (Izin)</label>

                            <input type="radio" class="btn-check" name="status_${idSiswa}" id="a_${idSiswa}" value="A">
                            <label class="btn btn-outline-danger btn-sm fw-bold" for="a_${idSiswa}">A (Alfa)</label>
                        </div>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    // Fungsi Simpan Absensi
    async function simpanAbsensi() {
        const kelas = document.getElementById('selectKelas').value;
        const tanggal = document.getElementById('tanggalAbsen').value;

        if (!kelas) {
            alert('Silakan pilih kelas terlebih dahulu!');
            return;
        }

        if (!tanggal) {
            alert('Silakan pilih tanggal absensi!');
            return;
        }

        alert(`Berhasil menyimpan absensi ${kelas} untuk tanggal ${tanggal}!`);
    }
</script>

</body>
</html>
