<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGMA EDU PRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #800020 0%, #4a0013 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="card card-login bg-white p-4">
    <div class="text-center mb-4">
        <img src="../logo-sekolah.jpg" alt="Logo SMP Kristen 4 Tanut" style="max-height: 85px;" class="mb-3">
        <h4 class="fw-bold text-dark mb-0">SIGMA EDU PRO</h4>
        <p class="text-muted small">SMP Kristen 4 Tanut</p>
    </div>

    <form id="formLogin">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Username / NIP / NIK</label>
            <input type="text" id="loginUser" class="form-control rounded-3" placeholder="Masukkan NIP, NIK, atau Username" required>
            <div class="form-text text-muted" style="font-size: 11px;">
                *Guru Honor dapat login menggunakan NIK
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold small">Password</label>
            <input type="password" id="loginPass" class="form-control rounded-3" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Aplikasi
        </button>
    </form>
</div>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
