<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGMA EDU PRO</title>

    <!-- Favicon untuk Menghilangkan Eror 404 di Browser -->
    <link rel="icon" type="image/jpeg" href="logo-sekolah.jpg">

    <!-- Manifest untuk Fitur PWA / Install Offline -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#800020">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Lokal -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #0d0d15 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 15px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            padding: 35px 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-maroon {
            background: #800020;
            color: #ffffff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-maroon:hover {
            background: #5e0018;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .form-control:focus {
            border-color: #800020;
            box-shadow: 0 0 0 0.25rem rgba(128, 0, 32, 0.15);
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Header Logo & Sekolah -->
    <div class="text-center mb-4">
        <img src="logo-sekolah.jpg" alt="Logo SMP Kristen 4 Tanut" class="img-fluid mb-2" style="max-height: 70px; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.15));">
        <h4 class="fw-bold mb-0 text-dark" style="letter-spacing: 0.5px;">SIGMA EDU PRO</h4>
        <p class="text-muted small mb-0">SMP Kristen 4 Tanut</p>
    </div>

    <!-- FORM LOGIN -->
    <form id="formLogin">
        <!-- Input Username -->
        <div class="mb-3">
            <label for="loginUser" class="form-label text-secondary small fw-semibold">Username / NIP / NIK</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control bg-light border-start-0" id="loginUser" placeholder="Masukkan ID" required autocomplete="username">
            </div>
            <span class="text-muted" style="font-size: 10px;">*Guru Honor dapat login menggunakan NIK</span>
        </div>

        <!-- Input Password -->
        <div class="mb-4">
            <label for="loginPass" class="form-label text-secondary small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
            </div>
        </div>

        <!-- Tombol Submit -->
        <button type="submit" class="btn btn-maroon w-100 py-2.5 rounded-3 shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Masuk Aplikasi
        </button>
    </form>

    <!-- Footer Card -->
    <div class="text-center text-muted border-top pt-3" style="font-size: 11px;">
        © 2026 SIGMA – SMP Kristen 4 Tanut
    </div>
</div>

<!-- SCRIPT LOKAL -->
<script src="js/db.js"></script>
<script src="js/auth.js"></script>

<!-- Registrasi Service Worker untuk Akses Offline -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker berhasil terdaftar:', reg.scope))
                .catch(err => console.error('Gagal mendaftarkan Service Worker:', err));
        });
    }
</script>
</body>
</html>
