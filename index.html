<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIGMA EDU PRO</title>
    
    <!-- Framework & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Background gambar tenun.jpg dengan overlay semi-transparan */
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.65)), 
                        url('tenun.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .card-login {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
        }

        .btn-maroon {
            background: linear-gradient(135deg, #800020 0%, #4a0013 100%);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-maroon:hover {
            background: linear-gradient(135deg, #990026 0%, #66001a 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(128, 0, 32, 0.4);
        }

        .form-control:focus {
            border-color: #800020;
            box-shadow: 0 0 0 0.25rem rgba(128, 0, 32, 0.15);
        }
    </style>
</head>
<body>

<div class="card card-login p-4">
    <div class="text-center mb-4">
        <!-- Logo Sekolah -->
        <img src="logo-sekolah.jpg" alt="Logo SMP Kristen 4 Tanut" style="max-height: 85px;" class="mb-3 filter-shadow">
        <h4 class="fw-bold text-dark mb-0">SIGMA EDU PRO</h4>
        <p class="text-muted small">SMP Kristen 4 Tanut</p>
    </div>

    <form id="formLogin">
        <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">Username / NIP / NIK</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                <input type="text" id="loginUser" class="form-control border-start-0 ps-0 rounded-end-3" placeholder="Masukkan NIP, NIK, atau Username" required>
            </div>
            <div class="form-text text-muted mt-1" style="font-size: 11px;">
                *Guru Honor dapat login menggunakan NIK
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold small text-secondary">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                <input type="password" id="loginPass" class="form-control border-start-0 ps-0 rounded-end-3" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-maroon w-100 fw-bold py-2.5 rounded-3 shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> Masuk Aplikasi
        </button>
    </form>

    <div class="text-center mt-4 pt-2 border-top">
        <small class="text-muted" style="font-size: 11px;">&copy; 2026 SIGMA - SMP Kristen 4 Tanut</small>
    </div>
</div>

<!-- JavaScript Modul -->
<script src="js/db.js"></script>

<!-- Tangani Login & Pindah Halaman Langsung -->
<script>
    document.getElementById('formLogin').addEventListener('submit', function(e) {
        // 1. Mencegah form melakukan submit standar (mencegah refresh otomatis)
        e.preventDefault(); 

        // 2. Langsung alihkan halaman ke Dashboard
        window.location.href = 'pages/dashboard.html';
    });
</script>
</body>
</html>
