<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA EDU PRO - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="card border-0 shadow-lg p-4 rounded-4" style="max-width: 400px; width: 90%;">
    <div class="text-center mb-4">
        <img src="assets/logo.png" alt="Logo SMP Kristen 4 Tanut" style="width: 80px; height: auto;" class="mb-2" onerror="this.style.display='none'">
        <h3 class="fw-bold text-primary mb-0">SIGMA EDU PRO</h3>
        <small class="text-muted">Sistem Informasi Administrasi Guru</small>
    </div>

    <form id="formLoginUtama">
        <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-person-fill me-1"></i>NIP / NIK</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan NIP atau NIK" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold"><i class="bi bi-lock-fill me-1"></i>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i> LOGIN
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <h6 class="fw-bold mb-0 text-dark">SMP KRISTEN 4 TANUT</h6>
        <small class="text-muted">SIGMA EDU PRO &copy; 2026</small>
    </div>
</div>

<script>
    // Langsung menangani proses Login di sini tanpa file external yang bentrok
    document.getElementById('formLoginUtama').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user && pass) {
            // Simpan status session
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userNip', user);

            // PAKSA MASUK KE DASHBOARD.HTML
            window.location.href = "pages/dashboard.html";
        } else {
            alert("Harap isi NIP/NIK dan Password!");
        }
    });
</script>

</body>
</html>
