<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGMA EDU PRO - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="card border-0 shadow-lg p-4 rounded-4" style="max-width: 400px; width: 90%;">
    <div class="text-center mb-4">
        <img src="logo-sekolah.jpg" alt="Logo SMP Kristen 4 Tanut" style="max-height: 85px; width: auto;" class="mb-3">
<h4 class="fw-bold text-primary mb-0">SIGMA EDU PRO</h4>
<p class="text-muted small">Sistem Informasi Administrasi Guru</p>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-person-fill me-1"></i>NIP / NIK</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan NIP atau NIK" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold"><i class="bi bi-lock-fill me-1"></i>Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required>
                <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm text-dark">
            <i class="bi bi-box-arrow-in-right me-1"></i> LOGIN
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <h6 class="fw-bold mb-0 text-dark">SMP KRISTEN 4 TANUT</h6>
        <small class="text-muted">SIGMA EDU PRO &copy; 2026</small>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Fitur Toggle Password
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            const icon = togglePasswordBtn.querySelector('i');
            if (icon) {
                icon.classList.toggle('bi-eye');
                icon.classList.toggle('bi-eye-slash');
            }
        });
    }

    // Proses Login Mandiri tanpa external JS yang bentrok
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const user = document.getElementById('username').value.trim();
        const pass = passwordInput.value.trim();

        if (user !== "" && pass !== "") {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userNip', user);

            // MEMAKSA MEMBUKA DASHBOARD
            window.location.replace("pages/dashboard.html");
        } else {
            alert("Silakan masukkan NIP/NIK dan Password Anda.");
        }
    });
</script>

</body>
</html>
